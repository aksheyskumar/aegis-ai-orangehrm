[project]
name = "aegis-ai-orangehrm"
version = "0.1.0"
description = "AI-assisted test automation framework for OrangeHRM"
requires-python = ">=3.14"
dependencies = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-playwright>=0.9",
    "playwright>=1.63",
    "allure-pytest>=2.16",
    "python-dotenv>=1.0"
]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v"
[tool.setuptools.packages.find]
include = ["framework*"]
